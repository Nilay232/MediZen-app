services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - db

  db:
    image: postgres:15

    environment:
      POSTGRES_DB: medizen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"
